<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin - Naufal Homebarber</title>
<style>
:root{--ink:#12203a;--red:#d4283a;--line:#c9d1db}
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:20px}
.w{max-width:820px;margin:0 auto}h1{margin:0 0 16px}h2{margin:32px 0 10px;font-size:20px}
.p{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
input,button{font:inherit}input{padding:10px;border:2px solid var(--line);border-radius:8px}
.b{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:8px;padding:8px;cursor:pointer;font-weight:600}
.chip small{display:block;font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.off{background:#e3e6ea;color:#7a8494;text-decoration:line-through}
.chip.taken{background:#fdecee;border-color:var(--red);cursor:default}
.chip.past{opacity:.35}
.bk{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.bk button{border:2px solid var(--red);color:var(--red);background:none;border-radius:8px;padding:4px 10px;cursor:pointer}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gl label{cursor:pointer;display:block;aspect-ratio:1;background:#dde3ea;border-radius:8px;overflow:hidden;position:relative;text-align:center}
.gl img{width:100%;height:100%;object-fit:cover}.gl span{position:absolute;bottom:0;left:0;right:0;background:#12203acc;color:#fff;font-size:13px;padding:4px}
.gl input{display:none}.e{color:var(--red)}
</style></head><body><div class="w">
<h1>Admin Naufal Homebarber</h1>
<div id="login" class="p"><input id="pw" type="password" placeholder="Kata laluan admin"> <button class="b" id="in">Masuk</button><p class="e" id="le"></p></div>
<div id="app" hidden>
<div class="p"><b>Slot</b> &nbsp;<input type="date" id="d"> <button class="b" id="close"></button>
<p style="margin:8px 0 0;font-size:14px">Tekan slot untuk on atau off. Slot merah ada booking.</p><div class="g" id="grid"></div></div>
<h2>Booking akan datang</h2><div class="p" id="up"></div>
<h2>Gambar gallery</h2><div class="p"><div class="gl" id="gl"></div><p class="e" id="ge"></p></div>
</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const call=async(p,body)=>{const r=await fetch('/api/admin/'+p,{method:body?'POST':'GET',headers:{'x-admin':sessionStorage.pw||'','content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){sessionStorage.removeItem('pw');$('#app').hidden=true;$('#login').hidden=false;$('#le').textContent='Kata laluan salah';throw 0}return r.json()};
const pad=n=>String(n).padStart(2,'0'),t=new Date();
$('#d').value=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
async function day(){const d=$('#d').value,r=await call('day?date='+d);
  $('#close').textContent=r.closed?'Buka hari ni':'Tutup hari ni';
  $('#grid').innerHTML=r.slots.map(s=>`<button class="chip ${s.s}" data-t="${s.t}" ${s.s==='taken'||s.s==='past'?'disabled':''}>${s.t}<small>${s.s==='taken'?esc(s.b.name||s.b.phone):s.s==='off'?'off':'on'}</small></button>`).join('')}
async function up(){const r=await call('upcoming');
  $('#up').innerHTML=r.bookings.length?r.bookings.map(b=>`<div class="bk"><span>${b.date} ${b.time}, ${esc(b.service)}, ${esc(b.name)} <a href="https://wa.me/${esc(b.phone)}">${esc(b.phone)}</a></span><button data-c="${b.id}">Batal</button></div>`).join(''):'Tiada booking lagi.'}
async function gal(){const r=await (await fetch('/api/gallery')).json(),im={};r.images.forEach(i=>im[i.slot]=i.img);
  $('#gl').innerHTML=[1,2,3,4,5,6].map(i=>`<label>${im[i]?`<img src="${im[i]}">`:''}<span>Gambar ${i}: tukar</span><input type="file" accept="image/*" data-s="${i}"></label>`).join('')}
function shrink(f){return new Promise(res=>{const i=new Image();i.onload=()=>{const w=Math.min(800,i.width),h=i.height*w/i.width,c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)})}
$('#gl').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=await call('gallery',{slot:+e.target.dataset.s,img:await shrink(f)});$('#ge').textContent=r.error||'';gal()};
$('#grid').onclick=async e=>{const c=e.target.closest('.chip');if(!c||c.disabled)return;await call('toggle',{date:$('#d').value,time:c.dataset.t});day()};
$('#close').onclick=async()=>{await call('toggle',{date:$('#d').value,time:'*'});day()};
$('#up').onclick=async e=>{if(e.target.dataset.c&&confirm('Batalkan booking ni?')){await call('cancel',{id:+e.target.dataset.c});up();day()}};
$('#d').onchange=day;
async function start(){await up();$('#login').hidden=true;$('#app').hidden=false;day();gal()}
$('#in').onclick=()=>{sessionStorage.pw=$('#pw').value;start().catch(()=>{})};
if(sessionStorage.pw)start().catch(()=>{});
</script></body></html>
